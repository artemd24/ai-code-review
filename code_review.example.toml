# Пример конфигурации для `python main.py --config code_review.example.toml ...`
# CLI-аргументы переопределяют значения из файла.

adapter = "local"
model = "qwen3"
level = "FULL"
api_key = "env:OPENROUTER_API_KEY"

# Лимит токенов на один запрос с текстом diff (необязательно; иначе считается из контекста модели).
# max_diff_tokens = 90000

[local]
source = "feature-branch"
target = "main"
output = "review.md"

